<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>📺 البث المباشر عبر HLS</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- استدعاء video.js -->
  <link href="https://vjs.zencdn.net/8.23.4/video-js.css" rel="stylesheet" />
  <script src="https://vjs.zencdn.net/8.23.4/video.min.js"></script>

  <!-- استدعاء hls.js (اختياري للفحص) -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    body {
      font-family: "Tajawal", sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
      padding: 30px;
    }
    h1 {
      color: #00ff88;
    }
    .video-container {
      max-width: 800px;
      margin: 20px auto;
    }
    .video-js {
      width: 100%;
      height: auto;
      border: 2px solid #00ff88;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>📡 البث المباشر HLS</h1>

  <div class="video-container">
    <video
      id="live-stream"
      class="video-js vjs-big-play-centered"
      controls
      autoplay
      preload="auto"
      playsinline
    ></video>
  </div>

  <script>
    const video = document.getElementById('live-stream');
    const videoSrc = "https://larixstream.ddns.net/hls/stream.m3u8"; // ✅ رابط البث من السيرفر

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      // للمتصفحات مثل Safari
      video.src = videoSrc;
      video.addEventListener('loadedmetadata', () => {
        video.play();
      });
    } else {
      alert("متصفحك لا يدعم HLS مباشرة.");
    }
  </script>
</body>
</html>
