<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>البث المباشر عبر HLS</title>
  <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .btn {
      background-color: #28a745;
      border: none;
      padding: 10px 20px;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      margin: 10px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #218838;
    }

    .controls {
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    #snapshot-preview {
      margin-top: 20px;
      max-width: 100%;
    }

    #video-info {
      margin-top: 10px;
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <h1>🎥 البث المباشر عبر HLS</h1>
  <button class="btn" onclick="toggleStream()">إخفاء البث</button>
  <div class="controls">
    <button class="btn" onclick="captureSnapshot()">📸 التقاط صورة</button>
    <button class="btn" onclick="downloadSnapshot()">💾 تحميل الصورة</button>
  </div>
  <video id="live-video" class="video-js vjs-default-skin" controls autoplay muted playsinline width="640" height="360"></video>
  <div id="video-info"></div>
  <img id="snapshot-preview" alt="صورة ملتقطة">
  <canvas id="snapshot-canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.0"></script>
  <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
  <script>
    const streamUrl = "https://smartlock-server.onrender.com/stream/hls/stream.m3u8";
    const video = document.getElementById('live-video');
    const canvas = document.getElementById('snapshot-canvas');
    const img = document.getElementById('snapshot-preview');
    const info = document.getElementById('video-info');

    const player = videojs('live-video', {
      autoplay: true,
      controls: true,
      responsive: true,
      fluid: true,
    });

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        video.play();
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => {
        video.play();
      });
    }

    function toggleStream() {
      if (video.style.display === "none") {
        video.style.display = "block";
      } else {
        video.style.display = "none";
      }
    }

    function captureSnapshot() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const dataURL = canvas.toDataURL('image/png');
      img.src = dataURL;
    }

    function downloadSnapshot() {
      if (!img.src) return alert("📷 التقط صورة أولاً!");
      const a = document.createElement('a');
      a.href = img.src;
      a.download = "snapshot.png";
      a.click();
    }

    video.addEventListener('loadeddata', () => {
      setTimeout(() => {
        info.textContent = `📏 الدقة: ${video.videoWidth} x ${video.videoHeight}`;
      }, 500);
    });
  </script>
</body>
</html>
