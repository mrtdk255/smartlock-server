<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>البث المباشر عبر HLS</title>
  <link href="https://vjs.zencdn.net/8.5.2/video-js.css" rel="stylesheet" />
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 20px;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 28px;
    }

    .btn {
      background-color: #28a745;
      border: none;
      padding: 10px 20px;
      color: white;
      font-size: 16px;
      border-radius: 5px;
      margin: 10px;
      cursor: pointer;
    }

    .btn:hover {
      background-color: #218838;
    }

    .controls {
      margin-top: 15px;
    }

    canvas {
      display: none;
    }

    #resolution-bar {
      background: rgba(0, 0, 0, 0.6);
      color: #0f0;
      font-size: 14px;
      padding: 6px 12px;
      border-radius: 8px;
      display: inline-block;
      margin-top: 12px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>🎥 البث المباشر عبر HLS</h1>

  <div class="controls">
    <button class="btn" onclick="startStream()">▶️ تشغيل البث</button>
    <button class="btn" onclick="stopStream()">⏹️ إيقاف البث</button>
    <button class="btn" onclick="captureAndDownload()">📸 التقاط و حفظ الصورة</button>
    <select id="imgQuality" class="btn">
      <option value="1">🖼️ جودة عالية (100%)</option>
      <option value="0.8">📷 جودة متوسطة (80%)</option>
      <option value="0.5">📉 جودة منخفضة (50%)</option>
    </select>
  </div>

  <video id="live-video" class="video-js vjs-default-skin" controls autoplay muted playsinline width="640" height="360"></video>

  <div id="resolution-bar">📏 الدقة: جاري التحميل...</div>

  <canvas id="snapshot-canvas"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.0"></script>
  <script src="https://vjs.zencdn.net/8.5.2/video.min.js"></script>
  <script>
    const streamUrl = "https://smartlock-server.onrender.com/stream/hls/stream.m3u8";
    const video = document.getElementById('live-video');
    const canvas = document.getElementById('snapshot-canvas');
    const resolutionBar = document.getElementById('resolution-bar');
    let hls, isStreaming = false;

    const player = videojs('live-video', {
      autoplay: true,
      controls: true,
      responsive: true,
      fluid: true,
    });

    function startStream() {
      if (Hls.isSupported() && !isStreaming) {
        hls = new Hls();
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play();
        });
        isStreaming = true;
      }
    }

    function stopStream() {
      if (hls) {
        hls.stopLoad();
        hls.detachMedia();
        hls.destroy();
        isStreaming = false;
      }
      video.pause();
      video.src = "";
    }

    function captureAndDownload() {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const quality = parseFloat(document.getElementById("imgQuality").value);
      const dataURL = canvas.toDataURL('image/png', quality);
      const a = document.createElement('a');
      a.href = dataURL;
      a.download = `snapshot_${Date.now()}.png`;
      a.click();
    }

    video.addEventListener('loadeddata', () => {
      setTimeout(() => {
        resolutionBar.textContent = `📏 الدقة: ${video.videoWidth} × ${video.videoHeight}`;
      }, 500);
    });
  </script>
</body>
</html>
