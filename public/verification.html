<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>البث المباشر HLS</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background: black; color: white; text-align: center; }
    video { width: 80%; margin-top: 20px; border: 2px solid green; }
  </style>
</head>
<body>
  <h2>🎥 البث المباشر عبر HLS</h2>
  <video id="video" controls autoplay></video>

  <script>
    const video = document.getElementById('video');
    const streamUrl = "/hls/stream.m3u8"; // عبر البروكسي من Render

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      video.addEventListener('loadedmetadata', () => video.play());
    }
  </script>
</body>
</html>
