<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>البث المباشر من الكاميرا (Larix Broadcaster)</title>
  <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />

  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      direction: rtl;
    }
    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
    }
    .status {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }
    .status.online { color: #0f0; }
    .status.offline { color: #f00; }
  </style>
</head>
<body>
  <div class="container">
    <h2>📹 البث المباشر (Larix Broadcaster)</h2>

    <!-- مشغل الفيديو -->
    <video
      id="liveVideo"
      class="video-js vjs-default-skin"
      controls
      autoplay
      muted
      playsinline
      width="100%"
      height="400"
      data-setup='{}'>
      <source src="https://larixstream.ddns.net/hls/stream.m3u8" type="application/x-mpegURL">
    </video>

    <!-- حالة البث -->
    <div id="status" class="status offline">🔴 البث متوقف</div>
  </div>

  <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
  <script>
    var player = videojs('liveVideo');
    var statusEl = document.getElementById("status");

    player.on('playing', function() {
      statusEl.textContent = "🟢 البث مباشر الآن";
      statusEl.className = "status online";
    });

    player.on('error', function() {
      statusEl.textContent = "🔴 البث متوقف";
      statusEl.className = "status offline";
    });
  </script>
</body>
</html>
