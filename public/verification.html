<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>🎥 البث المباشر HLS</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    body { background: #111; color: #fff; text-align: center; font-family: Arial; }
    video { width: 80%; max-width: 800px; margin-top: 30px; border: 2px solid #28a745; border-radius: 8px; }
  </style>
</head>
<body>
  <h2>🎥 البث المباشر عبر HLS</h2>
  <video id="video" controls autoplay></video>

  <script>
    const video = document.getElementById('video');
    const videoSrc = "https://larixstream.ddns.net/hls/stream.m3u8";

    if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(videoSrc);
      hls.attachMedia(video);
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = videoSrc;
    }
  </script>
</body>
</html>
